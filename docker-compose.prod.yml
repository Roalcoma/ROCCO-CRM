services:

  # ── CRM App ─────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rocco-crm:latest
    container_name: crm_app
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL:              postgresql://crm:${POSTGRES_PASSWORD}@db:5432/crm
      JWT_SECRET:                ${JWT_SECRET}
      AGENCY_JWT_SECRET:         ${AGENCY_JWT_SECRET:-}
      PORT:                      3100
      PUBLIC_URL:                ${PUBLIC_URL}
      FRONTEND_URL:              ${PUBLIC_URL}
      META_APP_ID:               ${META_APP_ID:-}
      META_APP_SECRET:           ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      INSTAGRAM_APP_ID:          ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET:      ${INSTAGRAM_APP_SECRET:-}
      META_WEBHOOK_ENFORCE_SIGNATURE: ${META_WEBHOOK_ENFORCE_SIGNATURE:-}
      META_BUSINESS_SCOPE:       ${META_BUSINESS_SCOPE:-}
      META_COMMENTS_SCOPE:       ${META_COMMENTS_SCOPE:-}
      ALLOW_PUBLIC_SIGNUP:       ${ALLOW_PUBLIC_SIGNUP:-}
      APP_URL:                   ${APP_URL:-${PUBLIC_URL}}
      GOOGLE_CLIENT_ID:          ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:      ${GOOGLE_CLIENT_SECRET:-}
      ZOOM_CLIENT_ID:            ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET:        ${ZOOM_CLIENT_SECRET:-}
      # Alertas de errores a Telegram y clave de cifrado de secretos en la BD
      # Evolution API del servidor: las instancias nuevas de cada cliente se crean aquí
      EVOLUTION_URL:             ${EVOLUTION_URL:-}
      EVOLUTION_API_KEY:         ${EVOLUTION_API_KEY:-}
      ALERT_WEBHOOK_URL:         ${ALERT_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN:        ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:          ${TELEGRAM_CHAT_ID:-}
      SECRETS_KEY:               ${SECRETS_KEY:-}
      # Web Push (PWA): claves VAPID; sin ellas las notificaciones del navegador quedan apagadas
      VAPID_PUBLIC_KEY:          ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:         ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:             ${VAPID_SUBJECT:-mailto:admin@rocco.arbolaureo.org}
      # Videos/imágenes de las automatizaciones (se sirven en /m/:token); persistente en el volumen crm_media
      MEDIA_DIR:                 /crm/server/data/media
      # Push de la app móvil (FCM): JSON del service account en ./secrets/fcm.json (opcional;
      # sin él el push queda desactivado). Se monta el directorio, no el archivo: si no existe,
      # Docker no crea un directorio con nombre de archivo.
      FCM_SERVICE_ACCOUNT_FILE:  /run/secrets-fcm/fcm.json
    volumes:
      - crm_media:/crm/server/data/media
      - ./secrets:/run/secrets-fcm:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_net

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: crm_db
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 2g
    environment:
      POSTGRES_USER:     crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       crm
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - crm_net

  # ── Landing Page (www.arbolaureo.org) ───────────────────────────────────────
  landing:
    image: nginx:alpine
    container_name: crm_landing
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./landing/dist:/usr/share/nginx/html:ro
    networks:
      - crm_net

  # Nota: Evolution API ya corre en el servidor (contenedor 'evolution-api', puerto 8080).
  # No se levanta uno nuevo para evitar conflicto de puertos.
  # Configura la instancia WA en el CRM apuntando a http://100.101.243.74:8080

networks:
  crm_net:
    name: crm_net

volumes:
  crm_pgdata:
  crm_media:
